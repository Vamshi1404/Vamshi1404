<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141321"/>
      <stop offset="50%" stop-color="#3a1f38"/>
      <stop offset="100%" stop-color="#FE428E"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b0810"/>
      <stop offset="100%" stop-color="#171024"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <g transform="translate(600,150)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" begin="1s" dur="1.4s" calcMode="spline" keySplines="0 0 0.58 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.9;1" keyTimes="0;1" begin="1s" dur="1.4s" calcMode="spline" keySplines="0 0 0.58 1" fill="freeze"/>
      <text x="0" y="-15" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="3" fill="#ffffff">Vamshi Thirumal Reddy</text>
      <text x="0" y="35" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="6" fill="#FE428E">money follows my broda</text>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -350 0" keyTimes="0;1" begin="0s" dur="1.4s" calcMode="spline" keySplines="0 0 0.58 1" fill="freeze"/>
    <rect x="0" y="0" width="600" height="300" fill="url(#panelGrad)"/>
    <rect x="598" y="0" width="2" height="300" fill="#FE428E"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 350 0" keyTimes="0;1" begin="0s" dur="1.4s" calcMode="spline" keySplines="0 0 0.58 1" fill="freeze"/>
    <rect x="600" y="0" width="600" height="300" fill="url(#panelGrad)"/>
    <rect x="600" y="0" width="2" height="300" fill="#FE428E"/>
  </g>
</svg>
