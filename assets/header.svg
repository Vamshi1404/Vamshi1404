<?xml version="1.0" encoding="UTF-8"?>
<svg id="headerSvg" xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#1a1a22"/>
    </linearGradient>
    <linearGradient id="glassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="16%" stop-color="#1e1e2a"/>
      <stop offset="40%" stop-color="#10101a"/>
      <stop offset="100%" stop-color="#08080e"/>
    </linearGradient>
    <linearGradient id="glassR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16161f"/>
      <stop offset="18%" stop-color="#1c1c27"/>
      <stop offset="42%" stop-color="#0f0f18"/>
      <stop offset="100%" stop-color="#07070c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <ellipse cx="600" cy="150" rx="400" ry="120" fill="#ffffff" opacity="0.05"/>

  <g id="txtWrap" transform="translate(600,150)">
    <g id="txtGroup" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" begin="0.45s" dur="1.05s" calcMode="spline" keySplines="0 0 0.58 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="0.9;1" keyTimes="0;1" begin="0.45s" dur="1.05s" calcMode="spline" keySplines="0 0 0.58 1" fill="freeze"/>
      <text id="nameText" x="0" y="-15" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="2" fill="#f6f6fa">Vamshi Thirumal Reddy</text>
      <text id="tagText" x="0" y="32" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="500" letter-spacing="5" fill="#9a9ca6">money follows my broda</text>
    </g>
  </g>

  <g id="panLeft">
    <animateTransform attributeName="transform" type="translate" values="0 0; -340 0" keyTimes="0;1" begin="0s" dur="1.2s" calcMode="spline" keySplines="0 0 0.58 1" fill="freeze"/>
    <rect x="0" y="0" width="600" height="300" fill="url(#glassL)"/>
    <rect x="-80" y="-20" width="110" height="340" transform="rotate(24 300 150)" fill="#ffffff" opacity="0.045"/>
    <rect x="-50" y="60" width="60" height="260" transform="rotate(24 300 150)" fill="#ffffff" opacity="0.028"/>
    <rect x="570" y="0" width="50" height="300" fill="#ffffff" opacity="0.035"/>
    <rect x="596" y="0" width="4" height="300" fill="#d9dbe2" opacity="0.6"/>
  </g>

  <g id="panRight">
    <animateTransform attributeName="transform" type="translate" values="0 0; 340 0" keyTimes="0;1" begin="0s" dur="1.2s" calcMode="spline" keySplines="0 0 0.58 1" fill="freeze"/>
    <rect x="600" y="0" width="600" height="300" fill="url(#glassR)"/>
    <rect x="1170" y="-20" width="110" height="340" transform="rotate(-24 900 150)" fill="#ffffff" opacity="0.04"/>
    <rect x="1190" y="70" width="60" height="250" transform="rotate(-24 900 150)" fill="#ffffff" opacity="0.028"/>
    <rect x="580" y="0" width="50" height="300" fill="#ffffff" opacity="0.035"/>
    <rect x="600" y="0" width="4" height="300" fill="#d9dbe2" opacity="0.6"/>
  </g>
</svg>
